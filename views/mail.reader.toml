# A mail reader: the accounts (if there are several), the folders, the mails of the selected folder,
# and the selected mail.
#
# Needs a mail module with the capabilities mail.accounts, mail.folders, mail.list, mail.search,
# mail.get and mail.attachment (to save an attachment), and grants for them in the layer that owns
# this view. The buttons and opening a mail start the commands mail.read, mail.unread, mail.star,
# mail.trash and mail.move-to (dragging a mail onto a folder), which need grants for mail.mark and
# mail.move as well. With the smtp module there are buttons for writing a mail, answering and
# forwarding (the view mail.compose); without it they are not shown.
#
# Keys (when you are not typing): r reply, a reply all, f forward, e edit a draft, c new mail,
# u mark unread, s star, S unstar, Delete trash, t conversations or single mails, m more, / search.
title = "Mail"
description = "Accounts, folders, the mails of a folder and the selected mail."

# the account that is shown; empty means the first one
[param.account]
type = "string"
default = ""

[param.folder]
type = "string"
default = "INBOX"

[param.message]
type = "string"
default = ""

# how many mails of the folder are shown; "More" raises it
[param.limit]
type = "int"
default = 200

# what is searched for; empty shows the folder
[param.query]
type = "string"
default = ""

# whether the remote images of the open mail may be loaded; it is asked for each mail
[param.images]
type = "bool"
default = false

# whether the mails of a conversation are shown together
[param.threaded]
type = "bool"
default = false

[source.accounts]
capability = "mail.accounts"

[source.folders]
capability = "mail.folders"
args = { account = { cel = "view.account != '' ? view.account : source.accounts.items[0].name" } }

[source.messages]
capability = "mail.list"
args = { account = { cel = "view.account != '' ? view.account : source.accounts.items[0].name" }, folder = { cel = "view.folder" }, limit = { cel = "view.limit" }, threaded = { cel = "view.threaded" } }
when = { cel = "view.query == ''" }

[source.found]
capability = "mail.search"
args = { account = { cel = "view.account != '' ? view.account : source.accounts.items[0].name" }, folder = { cel = "view.folder" }, query = { cel = "view.query" }, limit = { cel = "view.limit" } }
when = { cel = "view.query != ''" }

# the selected mail is read only when there is one
[source.current]
capability = "mail.get"
args = { message = { cel = "view.message" }, images = { cel = "view.images" } }
when = { cel = "view.message != ''" }

[[component]]
type = "row"

# the accounts (only if there are several) and the folders; choosing one forgets the selected mail
[[component.children]]
type = "column"
width = 200

[[component.children.children]]
type = "list"
items = { cel = "source.accounts.items" }
title = { cel = "item.name" }
subtitle = { cel = "item.state == 'ok' ? '' : item.state" }
emphasis = { cel = "item.name == (view.account != '' ? view.account : source.accounts.items[0].name)" }
select = { param = "account", value = { cel = "item.name" }, clear = ["folder", "message", "limit", "query", "images"] }
visible = { cel = "size(source.accounts.items) > 1" }

[[component.children.children]]
type = "list"
items = { cel = "source.folders.folders" }
title = { cel = "item.name + (item.unread > 0 ? ' (' + string(item.unread) + ')' : '')" }
emphasis = { cel = "item.unread > 0" }
select = { param = "folder", value = { cel = "item.name" }, clear = ["message", "limit", "query", "images"] }
drop = { command = "mail.move-to", param = "message", args = { folder = { cel = "item.name" } } }
empty = "No folders"

# the mails of the folder (or the search), unread ones in bold; opening one marks it read
[[component.children]]
type = "column"
width = 460

[[component.children.children]]
type = "row"

[[component.children.children.children]]
type = "button"
label = "New mail"
opens = { view = "mail.compose", params = { mode = "new", account = { cel = "view.account != '' ? view.account : source.accounts.items[0].name" } } }
key = "c"
requires_modules = ["smtp"]

[[component.children.children.children]]
type = "button"
label = "Conversations"
sets = { param = "threaded", value = true }
key = "t"
visible = { cel = "!view.threaded" }

[[component.children.children.children]]
type = "button"
label = "Single mails"
sets = { param = "threaded", value = false }
key = "t"
visible = { cel = "view.threaded" }

[[component.children.children]]
type = "input"
param = "query"
placeholder = "Search the folder (sender, subject, text)"
key = "/"

[[component.children.children]]
type = "table"
rows = { cel = "view.query == '' ? source.messages.items : source.found.items" }
empty = "No mail"
emphasis = { cel = "item.unread" }
columns = [
  { title = "", value = { cel = "item.starred ? '*' : ''" } },
  { title = "From", value = { cel = "item.from" } },
  { title = "Subject", value = { cel = "(view.threaded && view.query == '' && item.depth > 0 ? '   > ' : '') + item.subject" } },
  { title = "Date", value = { cel = "item.time" }, format = "datetime" },
]
select = { param = "message", value = { cel = "item.id" }, clear = ["images"], then = { command = "mail.read", args = { message = { cel = "item.id" } } } }
drag = { cel = "item.id" }

[[component.children.children]]
type = "button"
label = "More"
sets = { param = "limit", value = { cel = "view.limit + 200" } }
key = "m"
visible = { cel = "size(view.query == '' ? source.messages.items : source.found.items) >= view.limit && view.limit < 1000" }

# the selected mail
[[component.children]]
type = "column"

[[component.children.children]]
type = "row"
visible = { cel = "view.message != ''" }

[[component.children.children.children]]
type = "button"
label = "Reply"
opens = { view = "mail.compose", params = { mode = "reply", reply_to = { cel = "view.message" } } }
key = "r"
requires_modules = ["smtp"]
visible = { cel = "view.folder != params.drafts_folder" }

[[component.children.children.children]]
type = "button"
label = "Reply all"
opens = { view = "mail.compose", params = { mode = "reply-all", reply_to = { cel = "view.message" } } }
key = "a"
requires_modules = ["smtp"]
visible = { cel = "view.folder != params.drafts_folder" }

[[component.children.children.children]]
type = "button"
label = "Forward"
opens = { view = "mail.compose", params = { mode = "forward", reply_to = { cel = "view.message" } } }
key = "f"
requires_modules = ["smtp"]

[[component.children.children.children]]
type = "button"
label = "Edit draft"
opens = { view = "mail.compose", params = { mode = "draft", reply_to = { cel = "view.message" } } }
key = "e"
requires_modules = ["smtp"]
visible = { cel = "view.folder == params.drafts_folder" }

[[component.children.children.children]]
type = "button"
label = "Mark unread"
command = "mail.unread"
args = { message = { cel = "view.message" } }
key = "u"

[[component.children.children.children]]
type = "button"
label = "Star"
command = "mail.star"
args = { message = { cel = "view.message" } }
key = "s"

[[component.children.children.children]]
type = "button"
label = "Unstar"
command = "mail.star"
args = { message = { cel = "view.message" }, starred = false }
key = "S"

[[component.children.children.children]]
type = "button"
label = "Trash"
command = "mail.trash"
args = { message = { cel = "view.message" } }
sets = { param = "message", value = "" }
key = "Delete"

[[component.children.children]]
type = "text"
value = "Select a mail to read it."
style = "muted"
visible = { cel = "view.message == ''" }

[[component.children.children]]
type = "text"
value = { cel = "source.current.subject" }
style = "title"
visible = { cel = "view.message != ''" }

[[component.children.children]]
type = "detail"
visible = { cel = "view.message != ''" }
fields = [
  { label = "From", value = { cel = "source.current.from" } },
  { label = "To", value = { cel = "source.current.to" } },
  { label = "Date", value = { cel = "source.current.time" }, format = "datetime" },
]

# the body: the HTML turned into safe text if the mail has HTML, else the plain text. Remote
# images are not loaded until the person says so for this mail.
[[component.children.children]]
type = "richtext"
blocks = { cel = "source.current.blocks" }
blocked = { cel = "source.current.blocked" }
images_param = "images"
visible = { cel = "view.message != '' && size(source.current.blocks) > 0" }

[[component.children.children]]
type = "text"
value = { cel = "source.current.text != '' ? source.current.text : '(this mail has no text)'" }
visible = { cel = "view.message != '' && size(source.current.blocks) == 0" }

[[component.children.children]]
type = "table"
visible = { cel = "view.message != '' && size(source.current.attachments) > 0" }
rows = { cel = "source.current.attachments" }
columns = [
  { title = "Attachment", value = { cel = "item.name" } },
  { title = "Type", value = { cel = "item.type" } },
  { title = "Size", value = { cel = "item.size" }, format = "bytes" },
]

# an attachment is saved where the person says; it is never opened or run
[[component.children.children.row_action]]
label = "Save..."
download = { capability = "mail.attachment", args = { message = { cel = "view.message" }, name = { cel = "item.name" } }, filename = { cel = "item.name" } }
