# SPDX-License-Identifier: Apache-2.0
format_version = 1
name = "praksis-mail"
description = "General rules for sorting incoming mail into folders."

[param.spam_folder]
type = "string"
default = "Spam"

[param.lists_folder]
type = "string"
default = "Lists"

[param.bulk_folder]
type = "string"
default = "Bulk"

[param.trash_folder]
type = "string"
default = "Trash"

[param.sent_folder]
type = "string"
default = "Sent"

[param.drafts_folder]
type = "string"
default = "Drafts"
