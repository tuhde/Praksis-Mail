format_version = 1

[[test]]
name = "Precedence bulk goes to Bulk"
[test.event]
type = "mail.received"
data = { message = "m1", folder = "INBOX", size = 1200, from = "a@example.com", to = "me@example.org", subject = "Hello", message_id = "<1@example.com>", cc = "", date = "2026-01-01T10:00:00Z", list_id = "", precedence = "bulk", x_spam_flag = "" }
[[test.call]]
capability = "mail.move"
args = { message = "m1", folder = "Bulk" }

[[test]]
name = "Precedence junk goes to Bulk"
[test.event]
type = "mail.received"
data = { message = "m1", folder = "INBOX", size = 1200, from = "a@example.com", to = "me@example.org", subject = "Hello", message_id = "<1@example.com>", cc = "", date = "2026-01-01T10:00:00Z", list_id = "", precedence = "junk", x_spam_flag = "" }
[[test.call]]
capability = "mail.move"
args = { message = "m1", folder = "Bulk" }

[[test]]
name = "the value is not case sensitive"
[test.event]
type = "mail.received"
data = { message = "m1", folder = "INBOX", size = 1200, from = "a@example.com", to = "me@example.org", subject = "Hello", message_id = "<1@example.com>", cc = "", date = "2026-01-01T10:00:00Z", list_id = "", precedence = "Bulk", x_spam_flag = "" }
[[test.call]]
capability = "mail.move"
args = { message = "m1", folder = "Bulk" }

[[test]]
name = "Precedence list is left alone"
[test.event]
type = "mail.received"
data = { message = "m1", folder = "INBOX", size = 1200, from = "a@example.com", to = "me@example.org", subject = "Hello", message_id = "<1@example.com>", cc = "", date = "2026-01-01T10:00:00Z", list_id = "", precedence = "list", x_spam_flag = "" }

[[test]]
name = "the bulk folder is a parameter"
[test.params]
bulk_folder = "Newsletters"
[test.event]
type = "mail.received"
data = { message = "m1", folder = "INBOX", size = 1200, from = "a@example.com", to = "me@example.org", subject = "Hello", message_id = "<1@example.com>", cc = "", date = "2026-01-01T10:00:00Z", list_id = "", precedence = "bulk", x_spam_flag = "" }
[[test.call]]
capability = "mail.move"
args = { message = "m1", folder = "Newsletters" }

[[test]]
name = "a list mail sent as bulk is left to the lists rule"
[test.event]
type = "mail.received"
data = { message = "m1", folder = "INBOX", size = 1200, from = "a@example.com", to = "me@example.org", subject = "Hello", message_id = "<1@example.com>", cc = "", date = "2026-01-01T10:00:00Z", list_id = "<news.lists.example>", precedence = "bulk", x_spam_flag = "" }
