data = { message = "m1", folder = "INBOX", size = 1200, from = "Shop <shop@example.com>", to = "me@example.org", subject = "Invoice 4711", message_id = "<1@example.com>", cc = "", date = "2026-01-01T10:00:00Z", list_id = "", precedence = "", x_spam_flag = "" }
