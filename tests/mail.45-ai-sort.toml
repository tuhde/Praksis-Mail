format_version = 1

[[test]]
name = "an invoice goes to the folder of its label"
[test.params]
ai_sort = true
ai_instructions = "Be careful."
[test.mock."mail.get"]
text = "Please pay 100 EUR"
[test.mock."ai.classify"]
label = "invoice"
matched = true
[test.event]
type = "mail.received"
data = { message = "m1", folder = "INBOX", size = 1200, from = "Shop <shop@example.com>", to = "me@example.org", subject = "Invoice 4711", message_id = "<1@example.com>", cc = "", date = "2026-01-01T10:00:00Z", list_id = "", precedence = "", x_spam_flag = "" }
[[test.call]]
capability = "mail.get"
args = { message = "m1" }
[[test.call]]
capability = "ai.classify"
args = { text = "From: Shop <shop@example.com>\nSubject: Invoice 4711\n\nPlease pay 100 EUR", labels = ["invoice", "receipt", "newsletter", "personal", "other"], instructions = "Be careful.", fallback = "", profile = "local" }
[[test.call]]
capability = "mail.move"
args = { message = "m1", folder = "Auto/invoice" }

