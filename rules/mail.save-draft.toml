# SPDX-License-Identifier: Apache-2.0
id = "mail.save-draft"
description = "Saves a mail that is not finished in the drafts folder. Nothing is sent. Saving again makes another draft; the old one is moved to the trash by hand."
effect = "local-write"
needs = ["mail.compose", "mail.append"]
requires_modules = ["smtp"]

[trigger]
kind = "command"
title = "Save a draft"
[[trigger.param]]
name = "to"
type = "string"
label = "To"
default = ""
widget = "recipients"
[[trigger.param]]
name = "cc"
type = "string"
label = "Cc"
default = ""
widget = "recipients"
[[trigger.param]]
name = "bcc"
type = "string"
label = "Bcc"
default = ""
widget = "recipients"
[[trigger.param]]
name = "subject"
type = "string"
label = "Subject"
default = ""
[[trigger.param]]
name = "text"
type = "string"
label = "Message"
default = ""
widget = "multiline"
[[trigger.param]]
name = "attachments"
type = "list"
label = "Attachments"
default = []
widget = "files"
[[trigger.param]]
name = "account"
type = "string"
default = ""
widget = "hidden"
[[trigger.param]]
name = "in_reply_to"
type = "string"
default = ""
widget = "hidden"
[[trigger.param]]
name = "references"
type = "string"
default = ""
widget = "hidden"

[[action]]
id = "compose"
capability = "mail.compose"
args = { account = { cel = "event.data.account" }, to = { cel = "event.data.to" }, cc = { cel = "event.data.cc" }, bcc = { cel = "event.data.bcc" }, subject = { cel = "event.data.subject" }, text = { cel = "event.data.text" }, in_reply_to = { cel = "event.data.in_reply_to" }, references = { cel = "event.data.references" }, attachments = { cel = "event.data.attachments" } }

[[action]]
id = "save"
capability = "mail.append"
args = { account = { cel = "event.data.account" }, folder = { cel = "params.drafts_folder" }, content = { cel = "results.compose.raw" }, seen = false, draft = true }
