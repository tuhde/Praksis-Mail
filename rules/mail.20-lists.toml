id = "mail.20-lists"
description = "Mailing list mail (it has a List-Id header) goes to the lists folder."
effect = "local-write"
needs = ["mail.move"]

[trigger]
kind = "event"
type = "mail.received"
filter = "event.data.list_id != ''"

[[action]]
id = "move"
capability = "mail.move"
args = { path = { cel = "event.data.path" }, folder = { cel = "params.lists_folder" } }

[[action]]
stop = true
