# SPDX-License-Identifier: Apache-2.0
id = "mail.send-message"
description = "Sends a mail, keeps a copy of it in the sent folder and remembers the people it was sent to. The copy is made after the mail was sent, so a failure of the copy never stops a mail from going out, and a command that is repeated after a crash puts the copy in place without sending the mail again."
effect = "external"
needs = ["mail.send", "mail.append", "contacts.add"]
requires_modules = ["smtp"]

[trigger]
kind = "command"
title = "Send a mail"
[[trigger.param]]
name = "to"
type = "string"
label = "To"
widget = "recipients"
[[trigger.param]]
name = "cc"
type = "string"
label = "Cc"
default = ""
widget = "recipients"
[[trigger.param]]
name = "bcc"
type = "string"
label = "Bcc"
default = ""
widget = "recipients"
[[trigger.param]]
name = "subject"
type = "string"
label = "Subject"
default = ""
[[trigger.param]]
name = "text"
type = "string"
label = "Message"
default = ""
widget = "multiline"
[[trigger.param]]
name = "attachments"
type = "list"
label = "Attachments"
default = []
widget = "files"
[[trigger.param]]
name = "account"
type = "string"
default = ""
widget = "hidden"
[[trigger.param]]
name = "in_reply_to"
type = "string"
default = ""
widget = "hidden"
[[trigger.param]]
name = "references"
type = "string"
default = ""
widget = "hidden"

[[action]]
id = "send"
capability = "mail.send"
args = { account = { cel = "event.data.account" }, to = { cel = "event.data.to" }, cc = { cel = "event.data.cc" }, bcc = { cel = "event.data.bcc" }, subject = { cel = "event.data.subject" }, text = { cel = "event.data.text" }, in_reply_to = { cel = "event.data.in_reply_to" }, references = { cel = "event.data.references" }, attachments = { cel = "event.data.attachments" } }

[[action]]
id = "keep"
capability = "mail.append"
args = { account = { cel = "event.data.account" }, folder = { cel = "params.sent_folder" }, content = { cel = "results.send.raw" }, seen = true }

# the address book is optional: without the module the mail is sent all the same
[[action]]
id = "learn"
capability = "contacts.add"
requires_modules = ["contacts"]
args = { addresses = { cel = "event.data.to + ', ' + event.data.cc + ', ' + event.data.bcc" } }
