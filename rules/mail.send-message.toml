# SPDX-License-Identifier: Apache-2.0
id = "mail.send-message"
description = "Sends a mail and keeps a copy of it in the sent folder. The copy is made after the mail was sent, so a failure of the copy never stops a mail from going out, and a repeat after a crash puts the copy in place without sending the mail again."
effect = "external"
needs = ["mail.send", "mail.append"]

[trigger]
kind = "command"
title = "Send a mail"
[[trigger.param]]
name = "to"
type = "string"
label = "To"
[[trigger.param]]
name = "cc"
type = "string"
label = "Cc"
default = ""
[[trigger.param]]
name = "bcc"
type = "string"
label = "Bcc"
default = ""
[[trigger.param]]
name = "subject"
type = "string"
label = "Subject"
[[trigger.param]]
name = "text"
type = "string"
label = "Text"
[[trigger.param]]
name = "in_reply_to"
type = "string"
default = ""
[[trigger.param]]
name = "references"
type = "string"
default = ""

[[action]]
id = "send"
capability = "mail.send"
args = { to = { cel = "event.data.to" }, cc = { cel = "event.data.cc" }, bcc = { cel = "event.data.bcc" }, subject = { cel = "event.data.subject" }, text = { cel = "event.data.text" }, in_reply_to = { cel = "event.data.in_reply_to" }, references = { cel = "event.data.references" } }

[[action]]
id = "keep"
capability = "mail.append"
args = { folder = { cel = "params.sent_folder" }, content = { cel = "results.send.raw" }, seen = true }
